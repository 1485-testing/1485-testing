<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="canonical" href="https://1485testing.netlify.app/cases/" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"홈","item":"https://1485testing.netlify.app/"},{"@type":"ListItem","position":2,"name":"시공 사례","item":"https://1485testing.netlify.app/cases/"}]}
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#1a4f8a;--primary-dark:#0d3060;--accent:#e53030;--bg:#f2f4f7;--card:#ffffff;--text:#111827;--muted:#6b7280;--muted2:#9ca3af;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05)}
    body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.65}
    a{color:inherit;text-decoration:none}
    header{background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:58px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
    .logo{font-size:18px;font-weight:900;letter-spacing:-0.5px;color:var(--primary)}
    .logo span{color:var(--accent)}
    .header-cta{background:var(--accent);color:#fff;padding:7px 14px;border-radius:6px;font-weight:700;font-size:13px}
    .page-tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:58px;z-index:90}
    .page-tab{flex:1;text-align:center;padding:12px 8px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
    .page-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .page-hero{background:var(--primary);padding:36px 20px 30px}
    .hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px}
    .hero-tag::before{content:'●';font-size:7px}
    .page-hero h1{font-size:24px;font-weight:900;color:#fff;letter-spacing:-0.3px;margin-bottom:6px}
    .page-hero p{font-size:14px;color:rgba(255,255,255,.8)}
    main{padding:20px 16px}
    .admin-link{text-align:right;margin-bottom:12px}
    .admin-link a{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:5px 12px;border-radius:6px;background:var(--card)}
    .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;-webkit-overflow-scrolling:touch}
    .filter-bar::-webkit-scrollbar{height:2px;background:var(--border)}
    .filter-bar::-webkit-scrollbar-thumb{background:var(--accent)}
    .filter-btn{white-space:nowrap;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:.15s}
    .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .filter-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}
    #cases-list{display:grid;gap:12px}
    .case-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.15s;box-shadow:var(--shadow)}
    .case-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(26,79,138,.12)}
    .case-img{width:100%;aspect-ratio:16/9;background:#e8eef5;display:flex;align-items:center;justify-content:center;font-size:42px}
    .case-body{padding:16px}
    .case-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .case-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(26,79,138,.08);color:var(--primary)}
    .case-date{font-size:11px;color:var(--muted2)}
    .case-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:6px}
    .case-location{font-size:12px;color:var(--muted);margin-bottom:8px}
    .case-desc{font-size:13px;color:var(--muted);line-height:1.7}
    .case-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
    .tag-chip{font-size:11px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--muted2)}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
    .cta-bottom{background:var(--accent);border-radius:10px;padding:24px 20px;text-align:center;margin-top:20px}
    .cta-bottom p{font-size:13px;color:rgba(255,255,255,.9);margin-bottom:14px;word-break:keep-all}
    .cta-bottom a{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--accent);padding:13px 28px;border-radius:8px;font-size:20px;font-weight:900}
    footer{background:var(--primary-dark);border-top:1px solid rgba(255,255,255,.08);padding:28px 20px;font-size:12px;text-align:center;line-height:2.1;margin-top:24px;color:rgba(255,255,255,.5)}
    .footer-logo{font-size:18px;font-weight:900;color:#fff;margin-bottom:10px}
    .footer-logo span{color:var(--accent)}
  </style>
</head>
<body>

<header>
  <div class="logo">스마트<span>디자인</span></div>
  <a href="tel:0503-7150-5346" class="header-cta">📞 긴급상담</a>
</header>

<div class="page-tabs">
  <a href="/" class="page-tab">홈</a>
  <a href="/cases/" class="page-tab active">시공사례</a>
</div>

<div class="page-hero">
  <div class="hero-tag">실제 시공 현장</div>
  <h1>시공 사례</h1>
  <p>스마트디자인 강동구 실제 시공 현장 기록</p>
</div>

<main>
  <div class="admin-link"><a href="/admin/">🔐 관리자 로그인</a></div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="전체">전체</button>
    <button class="filter-btn" data-filter="변기교체">변기교체</button>
    <button class="filter-btn" data-filter="세면대수전교체">세면대수전</button>
    <button class="filter-btn" data-filter="싱크대수전교체">싱크대수전</button>
    <button class="filter-btn" data-filter="환풍기교체">환풍기교체</button>
    <button class="filter-btn" data-filter="샤워기수전교체">샤워기수전</button>
  </div>

  <div id="cases-list"><div class="empty-state">⏳ 불러오는 중...</div></div>

  <div class="cta-bottom">
    <p>시공 문의는 24시 전화 상담으로 빠르게!</p>
    <a href="tel:0503-7150-5346">📞 0503-7150-5346</a>
  </div>
</main>

<footer>
  <div class="footer-logo">스마트<span>디자인</span></div>
  대표자: 함종록 | 사업자: 427-05-01489<br>
  경기도 하남시 대청로 59번길 15 | 0503-7150-5346<br>
  <a href="https://place.map.kakao.com/245135047" target="_blank" style="color:rgba(255,255,255,.5)">📍 카카오맵에서 보기</a><br>
  © 2026 스마트디자인.
</footer>

<script>
const svcIcon={'변기교체':'🚽','세면대수전교체':'🪣','싱크대수전교체':'🍳','샤워기수전교체':'🚿','환풍기교체':'💨'};
let allCases=[];
let currentFilter='전체';

async function loadCases(){
  try{
    const res=await fetch('/data/cases.json');
    allCases=await res.json();
    renderCases(allCases);
  }catch(e){
    document.getElementById('cases-list').innerHTML='<div class="empty-state">😕 사례를 불러올 수 없습니다.</div>';
  }
}

function renderCases(cases){
  const list=document.getElementById('cases-list');
  const filtered=currentFilter==='전체'?cases:cases.filter(c=>c.service===currentFilter);
  if(!filtered.length){list.innerHTML='<div class="empty-state">해당 카테고리의 사례가 아직 없습니다.</div>';return;}
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  list.innerHTML=sorted.map(c=>`
    <article class="case-card">
      <div class="case-img">${c.image?`<img src="${c.image}" alt="${c.title}" style="width:100%;height:100%;object-fit:cover">`:(svcIcon[c.service]||'🔧')}</div>
      <div class="case-body">
        <div class="case-meta"><span class="case-badge">${c.service}</span><span class="case-date">${c.date}</span></div>
        <div class="case-title">${c.title}</div>
        <div class="case-location">📍 ${c.location}</div>
        <div class="case-desc">${c.description}</div>
        <div class="case-tags">${c.tags.map(t=>`<span class="tag-chip">#${t}</span>`).join('')}</div>
      </div>
    </article>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    renderCases(allCases);
  });
});

loadCases();
</script>
</body>
</html>
