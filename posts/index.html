<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지역 정보 | 스마트디자인 강동구 집수리</title>
  <meta name="description" content="강동구 천호동·성내동·길동·암사동 등 지역별 변기교체·수전교체·환풍기교체 출장 안내. 스마트디자인 0503-7150-5346" />
  <link rel="canonical" href="https://1485testing.netlify.app/posts/" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#1a4f8a;--primary-dark:#0d3060;--accent:#e53030;--bg:#f2f4f7;--card:#ffffff;--text:#111827;--muted:#6b7280;--muted2:#9ca3af;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05)}
    body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.65}
    a{color:inherit;text-decoration:none}
    header{background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:58px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
    .logo{font-size:18px;font-weight:900;letter-spacing:-0.5px;color:var(--primary)}
    .logo span{color:var(--accent)}
    .header-cta{background:var(--accent);color:#fff;padding:7px 14px;border-radius:6px;font-weight:700;font-size:13px}
    .page-tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:58px;z-index:90}
    .page-tab{flex:1;text-align:center;padding:12px 8px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
    .page-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .page-hero{background:var(--primary);padding:36px 20px 30px}
    .hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px}
    .hero-tag::before{content:'●';font-size:7px}
    .page-hero h1{font-size:24px;font-weight:900;color:#fff;letter-spacing:-0.3px;margin-bottom:6px}
    .page-hero p{font-size:14px;color:rgba(255,255,255,.8)}
    main{padding:20px 16px}
    .search-bar{margin-bottom:12px}
    .search-bar input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card);color:var(--text);font-family:inherit}
    .search-bar input:focus{outline:none;border-color:var(--primary)}
    .search-bar input::placeholder{color:var(--muted2)}
    .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
    .filter-bar::-webkit-scrollbar{height:2px;background:var(--border)}
    .filter-bar::-webkit-scrollbar-thumb{background:var(--primary)}
    .filter-btn{white-space:nowrap;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:.15s}
    .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .filter-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}
    #posts-count{font-size:12px;color:var(--muted2);margin-bottom:12px}
    #posts-list{display:grid;gap:8px}
    .post-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:.15s;border-left:3px solid transparent;box-shadow:var(--shadow)}
    .post-card:hover{border-left-color:var(--primary);box-shadow:0 4px 12px rgba(26,79,138,.12)}
    .post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .post-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(26,79,138,.08);color:var(--primary)}
    .post-date{font-size:11px;color:var(--muted2)}
    .post-title{font-size:15px;font-weight:800;color:var(--text);word-break:keep-all}
    .post-location{font-size:13px;color:var(--muted)}
    .post-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--primary);margin-top:2px}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
    footer{background:var(--primary-dark);border-top:1px solid rgba(255,255,255,.08);padding:28px 20px;font-size:12px;text-align:center;line-height:2.1;margin-top:24px;color:rgba(255,255,255,.5)}
    .footer-logo{font-size:18px;font-weight:900;color:#fff;margin-bottom:10px}
    .footer-logo span{color:var(--accent)}
  </style>
</head>
<body>

<header>
  <div class="logo">스마트<span>디자인</span></div>
  <a href="tel:0503-7150-5346" class="header-cta">📞 긴급상담</a>
</header>
<div class="page-tabs">
  <a href="/" class="page-tab">홈</a>
  <a href="/cases/" class="page-tab">시공사례</a>
  <a href="/posts/" class="page-tab active">지역정보</a>
</div>
<div class="page-hero">
  <div class="hero-tag">매일 자동 업데이트</div>
  <h1>지역 정보</h1>
  <p>강동구·하남시 지역별 집수리 출장 안내</p>
</div>

<main>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="지역 또는 서비스 검색 (예: 천호동, 변기교체)" />
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="전체">전체</button>
    <button class="filter-btn" data-filter="변기교체">변기교체</button>
    <button class="filter-btn" data-filter="수전교체">수전교체</button>
    <button class="filter-btn" data-filter="환풍기교체">환풍기교체</button>
    <button class="filter-btn" data-filter="세면대교체">세면대교체</button>
    <button class="filter-btn" data-filter="싱크대수전">싱크대수전</button>
    <button class="filter-btn" data-filter="샤워기수전교체">샤워기수전</button>
  </div>
  <div id="posts-count"></div>
  <div id="posts-list"><div class="empty-state">⏳ 불러오는 중...</div></div>
</main>

<footer>
  <div class="footer-logo">스마트<span>디자인</span></div>
  대표자: 함종록 | 사업자: 427-05-01489<br>
  경기도 하남시 대청로 59번길 15 | 0503-7150-5346<br>
  <a href="https://place.map.kakao.com/245135047" target="_blank" style="color:rgba(255,255,255,.5)">📍 카카오맵에서 보기</a><br>
  © 2026 스마트디자인.
</footer>

<script>
let allPosts=[];
let currentFilter='전체';
let searchQuery='';

async function loadPosts(){
  try{
    const res=await fetch('/data/posts.json');
    allPosts=await res.json();
    render();
  }catch(e){
    document.getElementById('posts-list').innerHTML='<div class="empty-state">😕 게시글을 불러올 수 없습니다.</div>';
  }
}

function render(){
  let filtered=allPosts;
  if(currentFilter!=='전체') filtered=filtered.filter(p=>p.service.includes(currentFilter));
  if(searchQuery){const q=searchQuery.toLowerCase();filtered=filtered.filter(p=>p.title.toLowerCase().includes(q)||p.location.toLowerCase().includes(q)||p.service.toLowerCase().includes(q))}
  document.getElementById('posts-count').textContent=`총 ${filtered.length}개`;
  const list=document.getElementById('posts-list');
  if(!filtered.length){list.innerHTML='<div class="empty-state">검색 결과가 없습니다.</div>';return;}
  list.innerHTML=filtered.map(p=>`
    <a href="${p.url}" class="post-card">
      <div class="post-meta"><span class="post-badge">${p.service}</span><span class="post-date">${p.date}</span></div>
      <div class="post-title">${p.title}</div>
      <div class="post-location">📍 ${p.location}</div>
      <span class="post-link">자세히 보기 →</span>
    </a>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    render();
  });
});

let st;
document.getElementById('search-input').addEventListener('input',e=>{
  clearTimeout(st);
  st=setTimeout(()=>{searchQuery=e.target.value.trim();render()},200);
});

loadPosts();
</script>
</body>
</html>
