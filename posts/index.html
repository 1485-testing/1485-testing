<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지역 정보 | 스마트디자인 강동구 집수리</title>
  <meta name="description" content="강동구 천호동·성내동·길동·암사동 등 지역별 변기교체·수전교체·환풍기교체 출장 안내. 스마트디자인 010-5064-2342" />
  <link rel="canonical" href="https://smart-designhome.netlify.app/posts/" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#1a4f8a;--accent:#e8a020;--bg:#f9f9f7;--card:#fff;--text:#222;--muted:#666;--border:#e0e0e0;--r:10px}
    body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.65}
    a{color:inherit;text-decoration:none}
    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;position:sticky;top:0;z-index:100}
    .logo{font-size:17px;font-weight:800}
    .header-cta{background:var(--accent);color:#fff;padding:7px 14px;border-radius:6px;font-weight:700;font-size:13px}
    .page-tabs{display:flex;border-bottom:2px solid var(--border);background:var(--card);position:sticky;top:56px;z-index:90}
    .page-tab{flex:1;text-align:center;padding:12px 8px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
    .page-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .page-hero{background:linear-gradient(135deg,#1a4f8a,#0d3060);color:#fff;padding:28px 20px 24px;text-align:center}
    .page-hero h1{font-size:20px;font-weight:800;margin-bottom:6px}
    .page-hero p{font-size:13px;opacity:.8}
    main{padding:20px 16px}
    .search-bar{display:flex;gap:8px;margin-bottom:14px}
    .search-bar input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;background:var(--card)}
    .search-bar input:focus{outline:none;border-color:var(--primary)}
    .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
    .filter-bar::-webkit-scrollbar{height:3px}
    .filter-btn{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:.2s}
    .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    #posts-count{font-size:13px;color:var(--muted);margin-bottom:12px}
    #posts-list{display:grid;gap:12px}
    .post-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
    .post-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
    .post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .post-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#e8f0fb;color:var(--primary)}
    .post-date{font-size:11px;color:var(--muted)}
    .post-title{font-size:15px;font-weight:800;color:var(--text);word-break:keep-all}
    .post-location{font-size:13px;color:var(--muted)}
    .post-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--primary);margin-top:4px}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
    .loading{text-align:center;padding:20px;color:var(--muted);font-size:13px}
    footer{background:#1a1a1a;color:rgba(255,255,255,.6);padding:24px 20px;font-size:12px;text-align:center;line-height:2;margin-top:24px}
    footer strong{color:#fff;font-size:14px;display:block;margin-bottom:4px}
  </style>
</head>
<body>

<header>
  <div class="logo">✦ 스마트디자인</div>
  <a href="tel:010-5064-2342" class="header-cta">📞 긴급상담</a>
</header>
<div class="page-tabs">
  <a href="/" class="page-tab">홈</a>
  <a href="/cases/" class="page-tab">시공사례</a>
  <a href="/posts/" class="page-tab active">지역정보</a>
</div>
<div class="page-hero">
  <h1>📍 지역 정보</h1>
  <p>강동구·하남시 지역별 집수리 출장 안내 (매일 자동 업데이트)</p>
</div>

<main>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="지역 또는 서비스 검색 (예: 천호동, 변기교체)" />
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="전체">전체</button>
    <button class="filter-btn" data-filter="변기교체">변기교체</button>
    <button class="filter-btn" data-filter="수전교체">수전교체</button>
    <button class="filter-btn" data-filter="환풍기교체">환풍기교체</button>
    <button class="filter-btn" data-filter="세면대교체">세면대교체</button>
    <button class="filter-btn" data-filter="싱크대수전">싱크대수전</button>
    <button class="filter-btn" data-filter="샤워기수전교체">샤워기수전</button>
  </div>
  <div id="posts-count"></div>
  <div id="posts-list"><div class="loading">⏳ 불러오는 중...</div></div>
</main>

<footer>
  <strong>스마트디자인</strong>
  대표자: 함종록 | 사업자: 427-05-01489<br>
  경기도 하남시 대청로 59번길 15 | 010-5064-2342<br>
  © 2026 스마트디자인.
</footer>

<script>
let allPosts = [];
let currentFilter = '전체';
let searchQuery = '';

async function loadPosts() {
  try {
    const res = await fetch('/data/posts.json');
    allPosts = await res.json();
    render();
  } catch (e) {
    document.getElementById('posts-list').innerHTML =
      '<div class="empty-state">😕 게시글을 불러올 수 없습니다.</div>';
  }
}

function render() {
  let filtered = allPosts;
  if (currentFilter !== '전체') {
    filtered = filtered.filter(p => p.service.includes(currentFilter));
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.location.toLowerCase().includes(q) ||
      p.service.toLowerCase().includes(q)
    );
  }

  const count = document.getElementById('posts-count');
  count.textContent = `총 ${filtered.length}개`;

  const list = document.getElementById('posts-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <a href="${p.url}" class="post-card">
      <div class="post-meta">
        <span class="post-badge">${p.service}</span>
        <span class="post-date">${p.date}</span>
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-location">📍 ${p.location}</div>
      <span class="post-link">자세히 보기 →</span>
    </a>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    render();
  }, 200);
});

loadPosts();
</script>
</body>
</html>
