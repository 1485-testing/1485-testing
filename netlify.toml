[build]
  publish = "."

[[redirects]]
  from = "/posts/:slug"
  to   = "/posts/:slug/index.html"
  status = 200

[[redirects]]
  from = "/cases/:slug"
  to   = "/cases/:slug/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
