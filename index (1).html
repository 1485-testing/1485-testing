<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>지역 시공 안내 | 스마트디자인 강동구 집수리</title>
  <meta name="description" content="강동구·하남시 지역별 변기교체·수전교체·환풍기교체 출장 안내. 스마트디자인 0503-7150-5346"/>
  <link rel="canonical" href="https://1485testing.netlify.app/posts/"/>
  <script src="/js/layout.js"></script>
  <style>
.search-bar{padding:16px 16px 0}
.search-bar input{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;background:var(--card);color:var(--tx);font-family:inherit;outline:none}
.search-bar input:focus{border-color:var(--p)}
.search-bar input::placeholder{color:var(--mu2)}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;transition:.15s;flex-shrink:0}
.fbtn.on{background:var(--p);color:#fff;border-color:var(--p)}
.fbtn:hover:not(.on){border-color:var(--p);color:var(--p)}
#count{font-size:12px;color:var(--mu2);padding:0 16px 10px}
.posts-grid{display:grid;gap:8px;padding:0 16px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh0);display:flex;transition:.15s;text-decoration:none}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.pc-thumb{width:80px;min-height:80px;background-color:#dde8f5;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px}
.pc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-body{padding:12px 14px;flex:1;min-width:0}
.pc-badge{display:inline-block;padding:2px 8px;background:var(--p3);color:var(--p);font-size:10px;font-weight:700;border-radius:4px;margin-bottom:5px}
.pc-title{font-size:13.5px;font-weight:800;color:var(--tx);margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.pc-meta{font-size:11px;color:var(--mu2)}
.empty-state{text-align:center;padding:40px 20px;color:var(--mu);font-size:14px}
  </style>
</head>
<body>
<div id="sd-header"></div>
<div style="padding:20px 16px 8px">
  <div style="font-size:18px;font-weight:900;color:var(--tx)">📰 지역별 시공 안내</div>
  <div style="font-size:13px;color:var(--mu);margin-top:4px">강동구·하남시 지역별 집수리 출장 안내 · 매일 업데이트</div>
</div>
<div class="search-bar"><input type="text" id="q" placeholder="지역 또는 서비스 검색 (예: 천호동, 변기교체)"/></div>
<div class="filter-bar">
  <button class="fbtn on" data-f="전체">전체</button>
  <button class="fbtn" data-f="변기교체">변기교체</button>
  <button class="fbtn" data-f="수전교체">수전교체</button>
  <button class="fbtn" data-f="환풍기교체">환풍기교체</button>
  <button class="fbtn" data-f="전체인테리어">인테리어</button>
  <button class="fbtn" data-f="바닥보수">바닥보수</button>
  <button class="fbtn" data-f="누수수리">누수수리</button>
</div>
<div id="count"></div>
<div class="posts-grid" id="grid"><div class="empty-state">⏳ 불러오는 중...</div></div>
<div id="sd-footer"></div>
<script>
SD.init();
var all=[],cf='전체',sq='';
fetch('/data/posts.json').then(function(r){return r.json()}).then(function(d){all=d;render()})
  .catch(function(){document.getElementById('grid').innerHTML='<div class="empty-state">게시글을 불러올 수 없습니다.</div>'});
function render(){
  var list=all;
  if(cf!=='전체') list=list.filter(function(p){return p.service.includes(cf)});
  if(sq){var q=sq.toLowerCase();list=list.filter(function(p){return (p.title+p.location+p.service).toLowerCase().includes(q)})}
  document.getElementById('count').textContent='총 '+list.length+'개';
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty-state">검색 결과가 없습니다.</div>';return;}
  g.innerHTML=list.map(function(p){
    var thumb=p.image
      ? '<div class="pc-thumb"><img src="'+p.image+'" alt="'+p.title+'" loading="lazy">'+p.icon+'</div>'
      : '<div class="pc-thumb" style="background:'+(p.imgBg||'#dde8f5')+'">'+p.icon+'</div>';
    return '<a href="'+p.url+'" class="pc">'+thumb
      +'<div class="pc-body"><span class="pc-badge">'+p.service+'</span>'
      +'<div class="pc-title">'+p.title+'</div>'
      +'<div class="pc-meta">📍 '+p.location+' · '+p.date+'</div>'
      +'</div></a>';
  }).join('');
}
document.querySelectorAll('.fbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on')});
    this.classList.add('on'); cf=this.dataset.f; render();
  });
});
var t;
document.getElementById('q').addEventListener('input',function(e){
  clearTimeout(t); t=setTimeout(function(){sq=e.target.value.trim();render()},200);
});
</script>
</body>
</html>
